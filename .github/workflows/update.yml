name: Update market data

on:
  # Основные часы вынесены наружу: внешний планировщик раз в 15 минут дёргает
  # workflow_dispatch через GitHub API, и запуск стартует сразу, без очереди
  # расписания. Токену для этого нужно единственное право «Actions: write».
  workflow_dispatch:

  schedule:
    # Только страховка, если внешние часы отвалятся. Родное расписание GitHub
    # исполняет «по возможности» и роняет почти все слоты (за сутки сработало
    # 1 раз из ~90), поэтому просим часто, а шаг «Нужен ли новый сбор»
    # пропускает работу, пока опубликованный снимок свежее порога.
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      collected: ${{ steps.gate.outputs.go }}
    steps:
      - uses: actions/checkout@v4

      # Частое расписание не значит частый сбор: смотрим, насколько стар уже
      # опубликованный снимок.
      #
      # Порог обходят все события кроме schedule: внешние часы бьют раз в 15 минут,
      # и на каждый их тик мы собираем заново — это и есть рабочий режим сайта.
      # Днём 6 августа порог временно закручивали до 12 минут, чтобы прогоны не
      # наезжали друг на друга во время аварии GitHub. Побочный эффект: сразу после
      # сбора опубликованному снимку 3 минуты, следующий тик его видел свежим и
      # пропускал сбор — данные обновлялись фактически раз в полчаса. Вернули как было.
      #
      # MIN_AGE нужен только для родного расписания GitHub (страховка каждые 5 минут):
      # оно собирает, лишь если внешние часы пропустили тик и снимок уже протух.
      - name: Нужен ли новый сбор
        id: gate
        run: |
          MIN_AGE=20
          AGE=999
          if curl -sfL --retry 2 -o prev-stats.json \
               "https://vanatoliyv.github.io/albion-craft-profit/data-stats.json"; then
            AGE=$(python3 -c "import json,datetime;b=json.load(open('prev-stats.json'))['builtAt'];t=datetime.datetime.fromisoformat(b.replace('Z','+00:00'));print(int((datetime.datetime.now(datetime.timezone.utc)-t).total_seconds()//60))" 2>/dev/null || echo 999)
          fi
          echo "Опубликованному снимку $AGE мин (порог $MIN_AGE), событие: ${{ github.event_name }}"
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$AGE" -ge "$MIN_AGE" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "Собираем заново"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "Снимок ещё свежий — сбор пропускаем, API не трогаем"
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'true'
        with:
          node-version: '20'

      - name: Собрать цены с Albion Online Data Project
        id: fetch
        if: steps.gate.outputs.go == 'true'
        continue-on-error: true
        run: node fetch.mjs

      # Снимок нужен всегда, а не только когда собирали заново: сайт публикуется
      # на каждом прогоне, и выкладывать его без цен нельзя.
      - name: Взять уже опубликованный снимок
        if: steps.gate.outputs.go != 'true' || steps.fetch.outcome != 'success'
        run: |
          echo "Свежего сбора нет, беру опубликованный снимок, чтобы сайт вышел с ценами"
          curl -sfL --retry 2 -o data.json \
            "https://vanatoliyv.github.io/albion-craft-profit/data.json" || true
          if [ -s data.json ]; then echo "Взят прежний снимок ($(wc -c < data.json) байт)"; else echo "Прежнего снимка нет"; fi

      - name: Собрать сайт
        run: |
          mkdir -p public
          cp index.html items.json public/
          [ -f data.json ] && cp data.json public/ || echo "data.json отсутствует — сайт уйдёт в режим прямого опроса API"
          [ -f data-stats.json ] && cp data-stats.json public/ || true
          touch public/.nojekyll
          ls -lh public/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
